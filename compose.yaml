# hobees - generated by hobees Studio (Containers)
# Environment values come from .env; no secret values are written here.
services:
  hobees:
    build:
      context: .
      dockerfile: Dockerfile
    image: hobees:local
    container_name: shaapc
    user: ${HOBEES_UID:-1000}:${HOBEES_GID:-1000}
    working_dir: /app
    env_file:
    - .env
    environment:
      HOBEES_ARTIFACTS_ROOT: /data/artifacts
      HOBEES_SKILLS_DIR: /data/skills
      HOBEES_CONTAINER_NAME: shaapc
      HOBEES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hobees}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hobees}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
    - ./artifacts:/data/artifacts
    - ./C:/Users/hessa/.hobees/skills:/data/skills
    entrypoint:
    - hobees
    command:
    - web --host 0.0.0.0 --port 8420
    init: true
    profiles:
    - runtime_only
    ports:
    - 8420:8420
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hobees}
      POSTGRES_USER: ${POSTGRES_USER:-hobees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
volumes:
  postgres_data: null
