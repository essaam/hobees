services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hobees}
      POSTGRES_USER: ${POSTGRES_USER:-hobees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  hobees:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOBEES_UID:-1000}:${HOBEES_GID:-1000}"
    working_dir: /app
    env_file:
      - .env
    environment:
      HOBEES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hobees}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hobees}
      HOBEES_ARTIFACTS_ROOT: /data/artifacts
      HOBEES_SKILLS_DIR: /data/skills
    volumes:
      - ./artifacts:/data/artifacts
      - ./skills:/data/skills
      # Optional declarative setup:
      # - ./config:/config:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["hobees"]
    command: ["--help"]
    init: true

volumes:
  postgres_data:
