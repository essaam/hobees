# hobees - generated by hobees Studio (Containers)
# Environment values come from .env; no secret values are written here.
services:
  hobees:
    build:
      context: .
      dockerfile: Dockerfile
    image: hobees:local
    container_name: hobees_cont_01
    user: "${HOBEES_UID:-10001}:${HOBEES_GID:-10001}"
    working_dir: /home/hobees
    env_file:
      - .env
    environment:
      HOBEES_ARTIFACTS_ROOT: /data/artifacts
      HOBEES_SKILLS_DIR: /data/skills
      HOBEES_CONTAINER_NAME: hobees_cont_01
      HOBEES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hobees}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hobees}
    volumes:
    # Change to desire host directory
      - ./artifacts:/data/artifacts
      - ./skills:/data/skills
    entrypoint:
      - hobees
    command:
      - web
      - --host
      - 0.0.0.0
      - --port
      - "6543"
    init: true
    profiles:
      - runtime_only
    ports:
      - "6543:6543"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hobees}
      POSTGRES_USER: ${POSTGRES_USER:-hobees}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data: