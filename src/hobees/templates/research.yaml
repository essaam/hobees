# hobees starter blueprint: research
#
# A research team with a searcher and synthesiser.
# Works with OpenAI + Gemini (each bee can use a different provider).
#
# Required environment variables (at least one):
#   OPENAI_API_KEY   — from https://platform.openai.com/api-keys
#   GEMINI_API_KEY   — from https://aistudio.google.com/app/apikey
#
# Usage:
#   hobees init --template research
#   hobees hive run research-team "Summarise the latest research on retrieval-augmented generation"

providers:
  - alias: "openai-main"
    provider_type: "openai"
    api_key_env: "OPENAI_API_KEY"
    default_model: "gpt-4o-mini"
    input_cost_per_1m: 0.15
    output_cost_per_1m: 0.60
    context_window_tokens: 128000

  - alias: "gemini-main"
    provider_type: "google_genai"
    api_key_env: "GEMINI_API_KEY"
    default_model: "gemini-2.0-flash"
    input_cost_per_1m: 0.075
    output_cost_per_1m: 0.30
    context_window_tokens: 1048576

bees:
  - name: "searcher"
    role_description: "Gathers information and facts on a topic"
    system_prompt: |
      You are a research specialist. Your job is to find, collect, and
      organise relevant information on the topic you are given.
      Be thorough, cite sources when possible, and avoid speculation.
    provider: "openai-main"
    model: "gpt-4o"
    temperature: 0.1
    thinking_level: "off"
    tools:
      - read_file
      - list_directory
      - save_memory

  - name: "synthesiser"
    role_description: "Synthesises research into clear, structured summaries"
    system_prompt: |
      You are an expert at synthesising complex information into clear,
      well-structured reports. Take the raw research provided and produce
      a coherent, accurate, and readable summary with section headings.
    provider: "gemini-main"
    model: "gemini-2.0-flash"
    temperature: 0.3
    thinking_level: "off"
    tools:
      - read_file
      - write_file
      - recall_memory

hives:
  - name: "research-team"
    goal_description: "Research team for gathering and synthesising information"
    supervisor_provider: "openai-main"
    supervisor_model: "gpt-4o-mini"
    supervisor_thinking_level: "medium"
    is_dynamic: false
    bees:
      - "searcher"
      - "synthesiser"

assistant:
  provider: "openai-main"
  model: "gpt-4o-mini"
  temperature: 0.7
  thinking_level: "off"
  tools:
    - read_file
    - write_file
    - list_directory
    - save_memory
    - recall_memory
